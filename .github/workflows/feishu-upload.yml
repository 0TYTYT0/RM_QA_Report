name: 发布答疑报告到飞书

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    if: ${{ github.event.pull_request.merged && github.base_ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 查找 PR 中新增或更新的报告
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | .filename | select(test("^reports/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?[.]md\\z"))' \
            > "$RUNNER_TEMP/feishu-reports.txt"
          if [[ -s "$RUNNER_TEMP/feishu-reports.txt" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.reports.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.reports.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: 安装依赖
        if: steps.reports.outputs.found == 'true'
        run: python -m pip install -r requirements.txt

      - name: 发布报告
        if: steps.reports.outputs.found == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          DOC_DOMAIN: ${{ vars.DOC_DOMAIN }}
        run: |
          mapfile -t reports < "$RUNNER_TEMP/feishu-reports.txt"
          python scripts/feishu.py -- "${reports[@]}"
