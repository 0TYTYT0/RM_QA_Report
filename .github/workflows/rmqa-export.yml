name: 导出并总结 RoboMaster 答疑

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install -r requirements.txt

      - name: 导出并验证 JSON
        run: |
          mkdir -p out
          python -u main.py
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(
              Path("out/rmqa_2027_clean.json").read_text(encoding="utf-8")
          )
          expected = {"id", "university", "team", "competition", "question", "answer"}

          if not isinstance(records, list) or not records:
              raise SystemExit("导出结果应为非空 JSON 列表")

          for index, record in enumerate(records, start=1):
              if not isinstance(record, dict) or set(record) != expected:
                  raise SystemExit(f"第 {index} 条记录的字段不符合预期")

          print(f"已验证 {len(records)} 条答疑记录")
          PY

      - name: 上传答疑 JSON
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rmqa-2027
          path: out/rmqa_2027_clean.json
          if-no-files-found: error

      - name: 校验快照并生成差异
        run: |
          python -u scripts/prepare_rmqa.py \
            --current out/rmqa_2027_clean.json \
            --published data/rmqa_2027_published.json \
            --output-dir out/report

      - name: 生成 Markdown 报告
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
        shell: python
        run: |
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          output_dir = Path("out/report")
          date = datetime.now(timezone(timedelta(hours=8))).date().isoformat()
          report = output_dir / f"{date}.md"
          if (output_dir / "model_input.txt").stat().st_size:
              subprocess.run([
                  sys.executable, "-u", "scripts/summarize_rmqa.py",
                  "--changes", str(output_dir / "changes.json"),
                  "--output-dir", str(output_dir),
                  "--date", date,
              ], check=True)
          else:
              report.write_text(
                  f"# {date} RMUC/UL 规则答疑总结\n\n本次没有答疑变更。\n",
                  encoding="utf-8",
              )
          if not report.is_file() or not report.stat().st_size:
              raise SystemExit("Markdown 报告缺失或为空")

      - name: 上传原始差异和报告
        uses: actions/upload-artifact@v7
        with:
          name: rmqa-report
          path: |
            out/report/changes.json
            out/report/*.md
          if-no-files-found: error
