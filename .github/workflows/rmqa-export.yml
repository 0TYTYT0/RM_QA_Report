name: 导出并总结 RoboMaster 答疑

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: rmqa-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has-changes: ${{ steps.report.outputs.has-changes }}
      report-date: ${{ steps.report.outputs.report-date }}
      baseline-hash: ${{ steps.report.outputs.baseline-hash }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install -r requirements.txt

      - name: 导出并验证 JSON
        run: |
          mkdir -p out
          python -u scripts/export_rmqa.py
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(
              Path("out/rmqa_2027_clean.json").read_text(encoding="utf-8")
          )
          expected = {"id", "university", "team", "competition", "question", "answer"}

          if not isinstance(records, list) or not records:
              raise SystemExit("导出结果应为非空 JSON 列表")

          for index, record in enumerate(records, start=1):
              if not isinstance(record, dict) or set(record) != expected:
                  raise SystemExit(f"第 {index} 条记录的字段不符合预期")

          print(f"已验证 {len(records)} 条答疑记录")
          PY

      - name: 上传答疑 JSON
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rmqa-2027
          path: out/rmqa_2027_clean.json
          if-no-files-found: error

      - name: 校验快照并生成差异
        run: |
          python -u scripts/prepare_rmqa.py \
            --current out/rmqa_2027_clean.json \
            --published data/rmqa_2027_published.json \
            --output-dir out/report

      - name: 生成 Markdown 报告
        id: report
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
        shell: python
        run: |
          import hashlib
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          output_dir = Path("out/report")
          date = datetime.now(timezone(timedelta(hours=8))).date().isoformat()
          report = output_dir / f"{date}.md"
          has_changes = (output_dir / "model_input.txt").stat().st_size > 0
          if has_changes:
              subprocess.run([
                  sys.executable, "-u", "scripts/summarize_rmqa.py",
                  "--changes", str(output_dir / "changes.json"),
                  "--output-dir", str(output_dir),
                  "--date", date,
              ], check=True)
          else:
              report.write_text(
                  f"# {date} RMUC/UL 规则答疑总结\n\n本次没有答疑变更。\n",
                  encoding="utf-8",
              )
          if not report.is_file() or not report.stat().st_size:
              raise SystemExit("Markdown 报告缺失或为空")
          baseline = Path("data/rmqa_2027_published.json").read_bytes()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
              print(f"has-changes={str(has_changes).lower()}", file=outputs)
              print(f"report-date={date}", file=outputs)
              print(f"baseline-hash={hashlib.sha256(baseline).hexdigest()}", file=outputs)

      - name: 上传原始差异和报告
        uses: actions/upload-artifact@v7
        with:
          name: rmqa-report
          path: |
            out/report/changes.json
            out/report/*.md
          if-no-files-found: error

  propose-publication:
    needs: export
    if: ${{ needs.export.outputs.has-changes == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 获取本轮快照
        uses: actions/download-artifact@v8
        with:
          name: rmqa_2027_clean.json
          path: out/publication/snapshot

      - name: 获取本轮报告
        uses: actions/download-artifact@v8
        with:
          name: rmqa-report
          path: out/publication/report

      - name: 核对基线并准备提交
        id: publication
        env:
          BASELINE_HASH: ${{ needs.export.outputs.baseline-hash }}
          REPORT_DATE: ${{ needs.export.outputs.report-date }}
        shell: python
        run: |
          import hashlib
          import os
          import re
          from pathlib import Path
          from shutil import copyfile

          baseline = Path("data/rmqa_2027_published.json")
          if hashlib.sha256(baseline.read_bytes()).hexdigest() != os.environ["BASELINE_HASH"]:
              raise SystemExit("默认分支的发布基线已更新，请重新运行工作流")

          date = os.environ["REPORT_DATE"]
          source = Path("out/publication/report") / f"{date}.md"
          report = Path("reports") / source.name
          if report.exists():
              report = report.with_stem(f"{date}-{os.environ['GITHUB_RUN_ID']}")

          readme = Path("readme.md")
          marker = "<!-- rmqa-latest-report -->"
          link = f"**最新报告** [{date} 答疑报告]({report.as_posix()}) {marker}"
          readme_text, count = re.subn(
              rf"^.*{re.escape(marker)}$", link, readme.read_text(encoding="utf-8"), flags=re.MULTILINE
          )
          if count != 1:
              raise SystemExit("README 必须包含且仅包含一处最新报告标记")

          copyfile("out/publication/snapshot/rmqa_2027_clean.json", baseline)
          copyfile(source, report)
          readme.write_text(readme_text, encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
              print(f"report-path={report.as_posix()}", file=outputs)

      - name: 创建或更新发布 PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/rmqa-publication
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          title: 发布 RoboMaster 答疑报告（${{ needs.export.outputs.report-date }}）
          commit-message: 更新 RoboMaster 答疑报告与发布基线
          body: |
            本 PR 提交本轮答疑报告和对应的完整快照，并更新 README 的最新报告链接。
            请审核报告内容，确认后合并以推进发布基线。

            工作流运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            data/rmqa_2027_published.json
            ${{ steps.publication.outputs.report-path }}
            readme.md
